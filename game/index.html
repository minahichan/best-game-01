<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Drift — a salvage arcade game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070a18;
    color: #dfe8ff;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 4px;
    color: #7fe7ff;
    text-transform: uppercase;
  }
  h1 span { color: #ffd166; }
  #wrap {
    width: min(960px, 96vw);
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 60px rgba(80, 140, 255, 0.25), 0 0 0 1px rgba(127, 231, 255, 0.25);
    border-radius: 6px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #0b1026;
    cursor: crosshair;
    touch-action: none;
  }
  p {
    margin: 0;
    font-size: 14px;
    color: rgba(223, 232, 255, 0.7);
    text-align: center;
  }
  p b { color: #dfe8ff; }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<h1>Lumen <span>Drift</span></h1>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<p><b>WASD / arrows</b> fly &nbsp;·&nbsp; hold <b>Space</b> tractor beam &nbsp;·&nbsp; <b>Shift</b> dash &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute</p>
<p>Salvage the shards, chain them for combos, clear 6 waves to complete the contract.</p>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
